<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Code</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 40px 24px 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo-svg {
      width: 60px;
      height: 60px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #000000;
    }

    .subtext {
      font-size: 14px;
      color: #333333;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .subtext strong {
      font-weight: 700;
    }

    .otp-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
      width: 100%;
    }

    .otp-input {
      width: 46px;
      height: 54px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background-color: #fcfcfc;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    .otp-input:focus {
      border-color: #a8a8a8;
      background-color: #ffffff;
    }

    .btn-confirm {
      width: 100%;
      height: 44px;
      background-color: #0095f6;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background-color 0.2s;
    }

    .btn-confirm:hover {
      background-color: #1877f2;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
      font-size: 14px;
      color: #262626;
      cursor: pointer;
    }

    .checkbox-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      accent-color: #0095f6;
      cursor: pointer;
    }

    .resend-section {
      font-size: 14px;
      color: #65676b;
      margin-bottom: 24px;
    }

    .resend-link {
      color: #0095f6;
      font-weight: 600;
      text-decoration: none;
    }

    .timer-text {
      margin-top: 4px;
      color: #65676b;
      font-size: 13px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #262626;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 32px;
    }

    .divider-container {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 24px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background-color: #dbdbdb;
    }

    .divider-text {
      padding: 0 16px;
      color: #8e8e8e;
      font-size: 13px;
    }

    .another-way-link {
      color: #0095f6;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
    }

    footer {
      width: 100%;
      margin-top: auto;
      padding-top: 20px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: #8e8e8e;
    }

    .footer-links a {
      color: #8e8e8e;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ig-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFDC80" />
            <stop offset="20%" stop-color="#FCAF45" />
            <stop offset="40%" stop-color="#F77737" />
            <stop offset="60%" stop-color="#F56040" />
            <stop offset="80%" stop-color="#FD1D1D" />
            <stop offset="90%" stop-color="#E1306C" />
            <stop offset="95%" stop-color="#C13584" />
            <stop offset="100%" stop-color="#833AB4" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="128" fill="url(#ig-gradient)" />
        <rect x="76" y="76" width="360" height="360" rx="96" fill="none" stroke="#FFFFFF" stroke-width="32" />
        <circle cx="256" cy="256" r="88" fill="none" stroke="#FFFFFF" stroke-width="32" />
        <circle cx="364" cy="148" r="20" fill="#FFFFFF" />
      </svg>
    </div>

    <h1>Enter your verification code</h1>
    
    <p class="subtext">
      We sent a verification code to <strong>your email address</strong>
    </p>

    <form id="otp-form">
      <div class="otp-container">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric" required />
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric" required />
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric" required />
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric" required />
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric" required />
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric" required />
      </div>

      <button type="submit" class="btn-confirm">Confirm</button>
    </form>

    <label class="checkbox-container">
      <input type="checkbox" />
      <span>Don't ask again on this device</span>
    </label>

    <div class="resend-section">
      Didn't receive a code? <a href="#" class="resend-link">Resend</a>
      <div class="timer-text">Resend available in <span id="timer">14</span>s</div>
    </div>

    <a href="index.html" class="back-link">&leftarrow; Back to login</a>

    <div class="divider-container">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <a href="#" class="another-way-link">Try another way</a>
  </div>

  <footer>
    <div class="footer-links">
      <a href="#">Meta</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
      <a href="#">Jobs</a>
      <a href="#">Help</a>
      <a href="#">API</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </div>
  </footer>

  <script>
    const inputs = document.querySelectorAll('.otp-input');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    let seconds = 14;
    const timerElement = document.getElementById('timer');
    const countdown = setInterval(() => {
      seconds--;
      if (seconds >= 0) {
        timerElement.textContent = seconds;
      } else {
        clearInterval(countdown);
      }
    }, 1000);
  </script>
</body>
</html>
